# Streamable HTTP transport: java ... --spring.profiles.active=http
spring:
  main:
    web-application-type: servlet
  security:
    user:
      name: ${MCP_HTTP_USER:mcp}
      password: ${MCP_HTTP_PASSWORD}   # required; no default on purpose
mcp:
  stdio:
    enabled: false
  http:
    endpoint: /mcp
server:
  address: ${MCP_HTTP_ADDRESS:127.0.0.1}
  port: ${MCP_HTTP_PORT:8080}
